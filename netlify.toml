# Netlify settings for the Betel Manchester app.
[build]
  publish = "."

# The app reads the church's latest YouTube videos through this address.
[[redirects]]
  from = "/yt-feed"
  to = "https://www.youtube.com/feeds/videos.xml?channel_id=UCCCzTneGFC7dKoo5OC9B04g"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
